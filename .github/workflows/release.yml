name: Release

# Push a tag like v0.1.0 to build every platform and publish a GitHub Release.
# Asset names carry no version so the downloads page can link to
# /releases/latest/download/<asset>.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14 # cross-compiled on Apple Silicon; macos-13 runners are retired
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          name=rhizomon-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/rhizomon README.md "$name/"
          cp LICENSE* "$name/" 2>/dev/null || true
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "rhizomon-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/rhizomon.exe", README.md $name
          Copy-Item LICENSE* $name -ErrorAction SilentlyContinue
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: rhizomon-${{ matrix.target }}
          path: |
            rhizomon-${{ matrix.target }}.tar.gz*
            rhizomon-${{ matrix.target }}.zip*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "Rhizomon $TAG" \
            --generate-notes
      - name: Rebuild the site with the new release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --repo "$REPO"
