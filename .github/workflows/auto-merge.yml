name: Auto-merge maintainer PRs

# Pull requests opened by the repository owner are squash-merged automatically
# once the required CI checks pass. Everyone else's PRs wait for the owner's
# review, as the branch ruleset requires.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.user.login == github.repository_owner && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
