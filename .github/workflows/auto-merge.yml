name: Auto-merge maintainer PRs

# Pull requests opened by the repository owner are squash-merged automatically
# once the required CI checks pass. Nobody else can merge or enable auto-merge
# (only the owner has write access), so everyone else's PRs wait for the
# owner's review. CI for outside contributors also needs the owner's approval
# before it runs (repository Actions setting).
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: github.event.pull_request.user.login == github.repository_owner && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
