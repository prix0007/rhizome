name: Pages

# Publishes site/ (the downloads page) to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "ui/logo.svg", ".github/workflows/pages.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
        run: |
          mkdir _site
          cp -R site/. _site/
          cp ui/logo.svg _site/logo.svg
          page_url="https://${OWNER}.github.io/${NAME}/"
          sed -i "s|__REPO__|${REPO}|g; s|__PAGE_URL__|${page_url}|g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
